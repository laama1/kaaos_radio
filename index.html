<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/favicon.png" rel="shortcut icon">
    <link href="style.css" rel="stylesheet">
    <script src="scripts/constellation.js" defer></script>
    <script src="scripts/player.js" defer></script>
    <script src="scripts/main.js" defer></script>
    <script src="scripts/balloons.js" defer></script>
    <title>kaaos.radio</title>
</head>
<body>
<canvas id="constellation" aria-hidden="true"></canvas>
<div id="balloons" aria-hidden="true"></div>
<pre>KAAOS.RADIO</pre>

<div class="station-selector" role="group" aria-label="Choose a station">
    <button type="button" class="station-button" data-station="live" aria-pressed="false">live</button>
    <button type="button" class="station-button" data-station="247stream" aria-pressed="true">247stream</button>
    <button type="button" class="station-button" data-station="chip" aria-pressed="false">chip</button>
    <button type="button" class="station-button" data-station="chillout" aria-pressed="false">chillout</button>
</div>

<div class="player-container">
    <div class="player-track" id="playerTrack"></div>
</div>

<template id="radioPlayerTemplate">
<section class="radio-player" aria-label="Radio player">
    <div class="player-title"><span data-station-name>247 stream</span></div>
    <div class="marquee">
        <span data-player-title class="marquee-text">KAAOS.RADIO</span>
    </div>
    
    <button class="custom-audio-btn" data-player-toggle aria-label="Play">
        <svg data-player-play class="custom-audio-icon" viewBox="0 0 60 60">
            <polygon points="15,10 50,30 15,50" />
        </svg>
        <svg data-player-pause class="custom-audio-icon" viewBox="0 0 60 60" style="display:none">
            <rect x="15" y="10" width="10" height="40" rx="3"/>
            <rect x="35" y="10" width="10" height="40" rx="3"/>
        </svg>
    </button>

    <div class="volume-control">
        <label class="volume-label" for="volumeSlider">
            <span>Volume</span>
            <output data-player-volume-value for="volumeSlider">75%</output>
        </label>
        <input
            class="volume-slider"
            id="volumeSlider"
            data-player-volume
            type="range"
            min="0"
            max="100"
            value="75"
            aria-label="Volume"
        >
    </div>

    <audio id="audioPlayer">
        Your browser does not support the audio element.
    </audio>
</section>
</template>

</body>
</html>
